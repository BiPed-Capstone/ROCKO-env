controller_manager:
  ros__parameters:
    update_rate: 50 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diffbot_base_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.32
    wheel_radius: 0.127

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: true
    # enable_odom_tf: true
    position_feedback: false

    cmd_vel_timeout: 1.0
    publish_limited_velocity: true
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 20.0
    linear.x.min_velocity: -20.0
    # Proposal 0015, option B (accepted by the owner 2026-11-22): 30 m/s^2 speeding up, slowing down and
    # reversing, so full forward to full reverse takes about 0.4 s at 6 m/s and 1 s at 15 m/s (it was
    # 1.2 s and 3 s at 10 m/s^2: measured on the robot, and these values on the mock). Signs are the
    # controller's own: max_deceleration <= 0, max_deceleration_reverse >= 0. The old
    # min_acceleration line was removed: it has no effect in this diff_drive_controller version.
    linear.x.max_acceleration: 160.0
    linear.x.max_deceleration: -160.0
    linear.x.max_deceleration_reverse: 160.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1000.0
    angular.z.min_velocity: -1000.0
    angular.z.max_acceleration: 1000.0
    angular.z.min_acceleration: -1000.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0
